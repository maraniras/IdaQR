<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TV-Kendis</title>
  <meta name="theme-color" content="#0b1f4d">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
      background: radial-gradient(120% 80% at 50% 0%, #1d4ed8 0%, #0b1f4d 55%, #050b1f 100%);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      font-size: clamp(3rem, 16vw, 6rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      text-align: center;
      background: linear-gradient(180deg, #fff6c9 0%, #f5c84c 55%, #c98a12 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .45));
    }
    .photo {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 3 / 4;
      border-radius: 20px;
      border: 4px solid #f5c84c;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
      overflow: hidden;
    }
    .photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity .8s ease;
    }
    .hidden { opacity: 0; }
    .intro { animation: fadein .8s ease both; }
    @keyframes fadein { from { opacity: 0; transform: scale(.97); } }
  </style>
</head>
<body>
  <h1>TV-Kendis</h1>
  <div class="photo" id="photo">
    <img id="first" class="hidden" src="ida.webp" alt="TV-Kendis med Ironman-medalje">
    <img id="second" src="ida2.webp" alt="TV-Kendis til fest">
  </div>
  <script>
    // Show the first photo only once per device; later visits go straight to the second.
    const KEY = "tvkendis-seen";
    let seen = false;
    try { seen = localStorage.getItem(KEY) === "1"; } catch (e) {}

    if (!seen) {
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      const first = document.getElementById("first");
      const second = document.getElementById("second");
      second.classList.add("hidden");
      first.classList.remove("hidden");
      document.getElementById("photo").classList.add("intro");
      setTimeout(() => {
        first.classList.add("hidden");
        second.classList.remove("hidden");
      }, 1800);
    }
  </script>
</body>
</html>
