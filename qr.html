<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR-kode</title>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px 16px;
      background: #eef1f7;
      color: #0b1f4d;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; max-width: 520px; }
    .controls input { flex: 1 1 260px; padding: 10px 12px; border: 1px solid #b9c2d6; border-radius: 8px; font: inherit; }
    .controls button { padding: 10px 14px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 28px;
      background: #fff;
      border: 6px solid #f5c84c;
      box-shadow: 0 20px 50px rgba(11, 31, 77, .18);
      text-align: center;
    }
    #qr { display: flex; justify-content: center; }
    #qr svg, #qr canvas { width: 100%; height: auto; max-width: 340px; }
    .card p { margin-top: 14px; font-size: 1.1rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #1d4ed8; }
    @media print {
      body { background: #fff; padding: 0; justify-content: center; }
      .controls { display: none; }
      .card { box-shadow: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <input id="url" type="url" aria-label="Link til siden">
    <button id="print">Print</button>
    <button id="png">Hent PNG</button>
  </div>

  <div class="card">
    <div id="qr"></div>
    <p>Scan mig</p>
  </div>

  <script>
    // Put the GitHub Pages address here, e.g. https://<user>.github.io/<repo>/
    const defaultUrl = "https://maraniras.github.io/IdaQR/";
    const input = document.getElementById("url");
    input.value = new URLSearchParams(location.search).get("url") || defaultUrl;

    const qr = new QRCodeStyling({
      width: 1000,
      height: 1000,
      type: "canvas",
      data: input.value,
      margin: 0,
      qrOptions: { errorCorrectionLevel: "Q" },
      dotsOptions: {
        type: "rounded",
        gradient: {
          type: "linear",
          rotation: Math.PI / 4,
          colorStops: [{ offset: 0, color: "#1d4ed8" }, { offset: 1, color: "#0b1f4d" }]
        }
      },
      cornersSquareOptions: { type: "extra-rounded", color: "#c98a12" },
      cornersDotOptions: { type: "dot", color: "#0b1f4d" },
      backgroundOptions: { color: "#ffffff" }
    });
    qr.append(document.getElementById("qr"));

    input.addEventListener("input", () => qr.update({ data: input.value }));
    document.getElementById("print").addEventListener("click", () => window.print());
    document.getElementById("png").addEventListener("click", () =>
      qr.download({ name: "qr-kode", extension: "png" }));
  </script>
</body>
</html>
